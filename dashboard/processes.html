    <script>
        (function() {
            const html = document.documentElement;
            const savedTheme = localStorage.getItem("theme");
            if (savedTheme) html.setAttribute("data-theme", savedTheme);
            if (localStorage.getItem("sidebar") === "collapsed") {
                html.setAttribute("data-sidebar", "collapsed");
            }
            const savedPalette = localStorage.getItem("accentPalette");
            const savedAccent = localStorage.getItem("accentColor");
            if (savedPalette) {
                html.setAttribute("data-palette", savedPalette);
            } else if (savedAccent) {
                html.style.setProperty("--user-accent", savedAccent);
                html.setAttribute("data-accent", "custom");
            }
        })();
    </script>

                                <th>PID</th>
