<svg xmlns="http://www.w3.org/2000/svg" viewBox="228 188 568 648" role="img" aria-label="TrueNAS Dashboard — Rack">
<title>TrueNAS Dashboard — Rack</title>
<style>
  .ld { transform-box: fill-box; transform-origin: left center;
        animation-name: load; animation-timing-function: ease-in-out;
        animation-iteration-count: infinite; animation-direction: alternate; }
  .led { transform-box: fill-box; transform-origin: center;
         animation: blink 2.2s ease-out infinite; }
  .l0 { animation-duration: 2.60s; animation-delay: -0.0s; }
  .n0 { animation-delay: 0.00s; }
  .l1 { animation-duration: 3.15s; animation-delay: -0.7s; }
  .n1 { animation-delay: 0.34s; }
  .l2 { animation-duration: 3.70s; animation-delay: -1.4s; }
  .n2 { animation-delay: 0.68s; }
  @keyframes load  { from { transform: scaleX(.22); } to { transform: scaleX(1); } }
  @keyframes blink { 0%,55% { opacity:.35; transform: scale(.85); }
                      68% { opacity:1; transform: scale(1.1); }
                      100% { opacity:.35; transform: scale(.85); } }
  @media (prefers-reduced-motion: reduce) { .ld, .led { animation: none; } }
</style>
<g transform="translate(0, 512) scale(1, 1.1515) translate(0, -512)">
  <rect x="248" y="248" width="528" height="528" rx="30" fill="#335C95" stroke="#5FA0DA" stroke-width="6"/>
