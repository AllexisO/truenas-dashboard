  <rect x="282" y="446" width="460" height="132" rx="24" fill="#4883BF"/>
  <rect x="316" y="484" width="150" height="12" rx="6" fill="#FEFEFE" opacity=".85"/>
  <rect x="316" y="506" width="112" height="12" rx="6" fill="#FEFEFE" opacity=".85"/>
  <rect class="ld l1" x="316" y="528" width="150" height="12" rx="6" fill="#4AB4C8"/>
  <rect x="282" y="610" width="460" height="132" rx="24" fill="#4883BF"/>
  <rect x="316" y="648" width="150" height="12" rx="6" fill="#FEFEFE" opacity=".85"/>
