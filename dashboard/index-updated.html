<!DOCTYPE html>
<html lang="en" data-theme="dark">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrueNAS Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/css/style-updated.css">

    <script>
        (function() {
            const html = document.documentElement;
            const savedTheme = localStorage.getItem("theme");
            if (savedTheme) html.setAttribute("data-theme", savedTheme);
            if (localStorage.getItem("sidebar") === "collapsed") {
                html.setAttribute("data-sidebar", "collapsed");
            } 
        })();
    </script>
</head>
<body>
    <div class="app">
        <aside class="sidebar">
            <div class="sidebar-brand">
                <div class="sidebar-brand-logo">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" shape-rendering="geometricPrecision">
                        <rect x="10" y="6" width="44" height="52" rx="6" fill="none" stroke="#3B8BD4" stroke-width="4"/>
                        <rect x="16" y="10" width="32" height="8" rx="2" fill="#3B8BD4" opacity="0.35"/>
                        <rect x="16" y="22" width="32" height="8" rx="2" fill="#3B8BD4" opacity="0.55"/>
                        <rect x="16" y="34" width="32" height="8" rx="2" fill="#3B8BD4" opacity="0.75"/>
                        <rect x="16" y="46" width="32" height="8" rx="2" fill="#3B8BD4" opacity="0.95"/>
                        <circle id="led-cpu" cx="20" cy="14" r="2.5" fill="#1D9E75" data-tooltip="CPU: --"></circle>
                        <circle id="led-ram" cx="20" cy="26" r="2.5" fill="#1D9E75" data-tooltip="RAM: --"></circle>
                        <circle id="led-disk" cx="20" cy="38" r="2.5" fill="#1D9E75" data-tooltip="Disks: --"></circle>
                        <circle id="led-network" cx="20" cy="50" r="2.5" fill="#1D9E75" data-tooltip="Network: --"></circle>
                    </svg>
                </div>
                <div class="sidebar-brand-text">
                    <div class="sidebar-brand-name">TrueNAS Dashboard</div>
                    <div class="sidebar-brand-version">v0.1</div>
                </div>
            </div>

            <nav class="sidebar-nav">
                <div class="sidebar-nav-group">
                    <button type="button" class="sidebar-nav-item active" data-section="overview">
                        <span class="sidebar-nav-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                                <polyline points="9 22 9 12 15 12 15 22"/>
                            </svg>
                        </span>
                        <span class="sidebar-nav-label">Overview</span>
                    </button>
                    <button type="button" class="sidebar-nav-item" data-section="cpu">
                        <span class="sidebar-nav-icon">
                           <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="4" y="4" width="16" height="16" rx="2"/>
                                <rect x="9" y="9" width="6" height="6"/>
                                <path d="M9 1v3M15 1v3M9 20v3M15 20v3M20 9h3M20 14h3M1 9h3M1 14h3"/>
                            </svg>
                        </span>
                        <span class="sidebar-nav-label">CPU</span>
                    </button>
                    <button type="button" class="sidebar-nav-item" data-section="memory">
                        <span class="sidebar-nav-icon">
                           <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="2" y="8" width="20" height="9" rx="1"/>
                                <path d="M6 12v2M10 12v2M14 12v2M18 12v2"/>
                            </svg>
                        </span>
                        <span class="sidebar-nav-label">Memory</span>
                    </button>
                    <button type="button" class="sidebar-nav-item" data-section="netwok">
                        <span class="sidebar-nav-icon">
                           <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="18" cy="5" r="3"/>
                                <circle cx="6" cy="12" r="3"/>
                                <circle cx="18" cy="19" r="3"/>
                                <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/>
                                <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
                            </svg>
                        </span>
                        <span class="sidebar-nav-label">Network</span>
                    </button>
                    <button type="button" class="sidebar-nav-item" data-section="storage">
                        <span class="sidebar-nav-icon">
                           <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <ellipse cx="12" cy="5" rx="9" ry="3"/>
                                <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/>
                                <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/>
                            </svg>
                        </span>
                        <span class="sidebar-nav-label">Storage</span>
                    </button>
                    <button type="button" class="sidebar-nav-item" data-section="processes">
                        <span class="sidebar-nav-icon">
                           <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="8" y1="6" x2="21" y2="6"/>
                                <line x1="8" y1="12" x2="21" y2="12"/>
                                <line x1="8" y1="18" x2="21" y2="18"/>
                                <line x1="3" y1="6" x2="3.01" y2="6"/>
                                <line x1="3" y1="12" x2="3.01" y2="12"/>
                                <line x1="3" y1="18" x2="3.01" y2="18"/>
                            </svg>
                        </span>
                        <span class="sidebar-nav-label">Processes</span>
                    </button>
                    <button type="button" class="sidebar-nav-item" data-section="system">
                        <span class="sidebar-nav-icon">
                           <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="2" y="3" width="20" height="14" rx="2"/>
                                <line x1="8" y1="21" x2="16" y2="21"/>
                                <line x1="12" y1="17" x2="12" y2="21"/>
                            </svg>
                        </span>
                        <span class="sidebar-nav-label">System</span>
                    </button>
                </div>

                <div class="sidebar-nav-devider"></div>

                <div class="sidebar-nav-group">
                    <button type="button" class="sidebar-nav-item" data-section="settings">
                        <span class="sidebar-nav-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </span>
                        <span class="sidebar-nav-label">Settings</span>
                    </button>
                </div>
            </nav>

            <div class="sidebar-footer">
                <div class="server-card">
                    <div class="server-card-row">
                        <span class="server-card-label">HOST</span>
                        <span class="server-card-value" id="server-ip"></span>
                    </div>
                    <div class="server-card-row">
                        <span class="server-card-label">Server Version</span>
                        <span class="server-card-value" id="server-version"></span>
                    </div>
                </div>
            </div>
        </aside>
        <main class="main">
            <header class="topbar">
                <div class="topbar-left">
                    <button type="button" class="topbar-button" id="sidebar-toggle" aria-label="Toggle sidebar">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="3" y1="6" x2="21" y2="6"/>
                            <line x1="3" y1="12" x2="21" y2="12"/>
                            <line x1="3" y1="18" x2="21" y2="18"/>
                        </svg>
                    </button>
                    <h1 class="topbar-title">Overview</h1>
                </div>
                <div class="topbar-right">
                    <div class="topbar-pill">
                        <div class="topbar-pill-dot" id="server-status-dot"></div>
                        <span class="topbar-pill-dot-text" id="server-status-text">Online</span>
                    </div>
                    <div class="topbar-pill">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"/>
                            <polyline points="12 6 12 12 16 14"/>
                        </svg>
                        <span id="server-uptime">...</span>
                    </div>
                    <button type="button" class="topbar-button topbar-button-theme" id="theme-toggle" aria-label="Toggle theme">
                        <svg class="topbar-theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="4"/>
                            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
                        </svg>
                        <svg class="topbar-theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                        </svg>
                    </button>
                </div>
            </header>

            <div class="content">
                <section class="summary-cards">
                    <article class="summary-card">
                        <header class="summary-card-header">
                            <span class="summary-card-icon">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="4" y="4" width="16" height="16" rx="2"/>
                                    <rect x="9" y="9" width="6" height="6"/>
                                    <path d="M9 1v3M15 1v3M9 20v3M15 20v3M20 9h3M20 14h3M1 9h3M1 14h3"/>
                                </svg>
                            </span>
                            <h2 class="summary-card-title">CPU</h2>
                        </header>

                        <!-- LOAD -->
                        <div class="metric-row" data-metric="load">
                            <svg class="ring-chart" viewBox="0 0 120 120" style="--progress: 0.00;">
                                <circle class="ring-chart-track" cx="60" cy="60" r="50"/>
                                <circle class="ring-chart-progress" id="cpu-load-ring" cx="60" cy="60" r="50" transform="rotate(-90 60 60)" stroke-dasharray="314.16" stroke-dashoffset="207.35"/>
                                <text class="ring-chart-value" x="60" y="58" text-anchor="middle" dominant-baseline="middle">
                                    <tspan id="cpu-load-percent">0</tspan><tspan class="ring-chart-unit">%</tspan>
                                </text>
                                <text class="ring-chart-label" x="60" y="82" text-anchor="middle" dominant-baseline="middle">LOAD</text>
                            </svg>

                            <div class="metric-stats">
                                <div class="metric-stats-row metric-stats-labels">
                                    <span>MIN</span>
                                    <span>MAX</span>
                                </div>
                                <div class="metric-stats-row">
                                    <span><b id="cpu-load-min">0%</b> <em id="cpu-load-min-time">00:00</em></span>
                                    <span><b id="cpu-load-max">0%</b> <em id="cpu-load-max-time">23:59</em></span>
                                </div>
                                <svg class="sparkline" viewBox="0 0 100 40" preserveAspectRatio="none">
                                    <defs>
                                        <linearGradient id="sparkline-gradient-cpu-load" x1="0" y1="0" x2="0" y2="1">
                                            <stop class="sparkline-stop-top" offset="0%"/>
                                            <stop class="sparkline-stop-bottom" offset="100%"/>
                                        </linearGradient>
                                    </defs>
                                    <path class="sparkline-area" id="cpu-load-sparkline-area" fill="url(#sparkline-gradient-cpu-load)"/>
                                    <polyline class="sparkline-line" id="cpu-load-sparkline"/>
                                </svg>
                            </div>
                        </div>

                        <div class="metric-divider"></div>

                        <!-- TEMP -->
                        <div class="metric-row" data-metric="temp">
                            <svg class="ring-chart" viewBox="0 0 120 120" style="--progress: 0.00;">
                                <circle class="ring-chart-track" cx="60" cy="60" r="50"/>
                                <circle class="ring-chart-progress" id="cpu-temp-ring" cx="60" cy="60" r="50" transform="rotate(-90 60 60)" stroke-dasharray="314.16" stroke-dashoffset="81.68"/>
                                <text class="ring-chart-value" x="60" y="58" text-anchor="middle" dominant-baseline="middle">
                                    <tspan id="cpu-temp-degrees">0</tspan><tspan class="ring-chart-unit">°</tspan>
                                </text>
                                <text class="ring-chart-label" x="60" y="82" text-anchor="middle" dominant-baseline="middle">TEMP</text>
                            </svg>

                            <div class="metric-stats">
                                <div class="metric-stats-row metric-stats-labels">
                                    <span>MIN</span>
                                    <span>MAX</span>
                                </div>
                                <div class="metric-stats-row">
                                    <span><b id="cpu-temp-min">0°C</b> <em id="cpu-temp-min-time">00:00</em></span>
                                    <span><b id="cpu-temp-max">0°C</b> <em id="cpu-temp-max-time">23:59</em></span>
                                </div>
                                <svg class="sparkline" viewBox="0 0 100 40" preserveAspectRatio="none">
                                    <defs>
                                        <linearGradient id="sparkline-gradient-cpu-temp" x1="0" y1="0" x2="0" y2="1">
                                            <stop class="sparkline-stop-top" offset="0%"/>
                                            <stop class="sparkline-stop-bottom" offset="100%"/>
                                        </linearGradient>
                                    </defs>
                                    <path class="sparkline-area" id="cpu-temp-sparkline-area" fill="url(#sparkline-gradient-cpu-temp)"/>
                                    <polyline class="sparkline-line" id="cpu-temp-sparkline"/>
                                </svg>
                            </div>
                        </div>
                    </article>
                    <div class="summary-card" id="server-ram-card">

                    </div>
                    <div class="summary-card" id="server-network-card">

                    </div>
                    <div class="summary-card" id="server-disks-card">

                    </div>
                </section>
                <section class="pannels">
                    <div class="panel">

                    </div>
                    <div class="panel">

                    </div>
                </section>
            </div>
        </main>
    </div>

    <script src="/js/header.js"></script>
    <script src="/js/settings.js"></script>
    <script src="/js/new-apex.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
